{% extends "base.html" %}

{% block content %}

<h1>Portal Login</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}


<form action="/login" method="POST">
    <label>Email</label>
    <input type="email" name="email" required>
    <br><br>

    <label>Password:</label>
    <input type="password" name="password" required>
    <br><br>

    <button type="submit">Login</button>
</form>

{% endblock %}
