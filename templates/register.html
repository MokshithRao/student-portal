
{% extends "base.html" %}

{% block content %}

<section class="auth-layout">
    <div class="auth-card">
        <div class="card-heading">
            <span class="eyebrow">Create account</span>
            <h1>Student Registration</h1>
            <p>Enter your details to join the Student Portal.</p>
        </div>

        {% if error %}
            <div class="alert alert-error" role="alert">{{ error }}</div>
        {% endif %}

        <form class="auth-form" action="/register" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="At least 8 characters" required>
            </div>

            <button class="button button-primary button-full" type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
    </div>
</section>

{% endblock %}
